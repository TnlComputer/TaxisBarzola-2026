; Configuración PHP del hosting (cPanel la lee automáticamente)
display_errors = Off
log_errors = On
; Cookie de sesión: no accesible por JavaScript, solo por HTTPS, sin envío desde otros sitios
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_samesite = Lax
